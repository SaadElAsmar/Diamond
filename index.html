<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3e8d0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diamond">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Diamond</title>
<style>
  :root { --ink: #3a2a14; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(180deg, #fdf9ef 0%, #f3e8d0 100%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .app {
    width: 100%; max-width: 440px; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    padding: calc(env(safe-area-inset-top) + 48px) 12px calc(env(safe-area-inset-bottom) + 28px);
  }

  /* Board */
  .frame {
    width: min(94vw, 416px); padding: 10px; border-radius: 14px;
    background: linear-gradient(145deg, #d9b679, #b08a4f);
    box-shadow: 0 10px 24px rgba(120,90,40,0.25), inset 0 0 0 2px #e9d3a2;
  }
  .frame { display: grid; grid-template-columns: 14px 1fr; grid-template-rows: 1fr 14px; gap: 4px; }
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1;
    gap: 2px; padding: 2px; border-radius: 4px; touch-action: none;
    background: #1c3d2e;
  }
  .ranks, .files { display: grid; gap: 2px; font-size: 12px; font-weight: 700; color: #5a3d16;
                   align-items: center; justify-items: center; }
  .ranks { grid-template-rows: repeat(8, 1fr); padding: 2px 0; }
  .files { grid-template-columns: repeat(8, 1fr); padding: 0 2px; grid-column: 2; }
  .cell {
    border: 0; background: transparent; padding: 0; margin: 0; aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    position: relative; cursor: pointer; background: #2d5b45; border-radius: 2px;
  }

  /* Pieces: 4 designs, each with two almost identical versions (bit 1 / bit 0) */
  .piece {
    position: relative; width: 34px; height: 34px; pointer-events: none;
    transform: scale(var(--k, 1)); transition: transform .15s;
  }
  .shell { position: absolute; inset: 0; transition: transform .35s ease; z-index: 2;
           filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35)); }
  .shell svg { width: 100%; height: 100%; display: block; }
  .gem  { position: absolute; left: 9px; top: 8px; width: 16px; height: 21px; z-index: 1;
          opacity: 0; transition: opacity .25s; }

  .cell.open .shell { transform: translateY(-24px) rotate(-10deg); }
  .cell.has .gem    { opacity: 1; }
  .cell.open::before {
    content: ""; position: absolute; inset: 4%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,110,0.8), rgba(255,214,110,0) 65%);
  }
  .cell.empty::before { background: radial-gradient(circle, rgba(0,0,0,0.25), rgba(0,0,0,0) 65%); }
  .cell.hover .piece { transform: scale(calc(var(--k, 1) * 1.15)); }

  /* Diamond tray + key */
  .tray { height: 64px; display: flex; align-items: center; justify-content: center; gap: 36px; }
  .diamond {
    width: 64px; height: 64px; border-radius: 50%; touch-action: none; cursor: grab;
    background: radial-gradient(circle, rgba(242,201,76,0.35), rgba(242,201,76,0) 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .diamond svg { width: 32px; height: 42px; }
  .diamond.gone { display: none; }

  .keybtn {
    display: none; width: 56px; height: 56px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: linear-gradient(180deg, #f6dc94, #d4a441);
    align-items: center; justify-content: center;
  }
  .keybtn.show { display: flex; animation: keyIn .55s cubic-bezier(.34,1.56,.64,1) both, keyGlow 2.4s ease-in-out .55s infinite; }
  .keybtn svg { transform-origin: 7px 12px; animation: keyTurn 2.4s ease-in-out infinite; }
  @keyframes keyIn   { 0% { opacity: 0; transform: translateY(-24px) scale(.3) rotate(-120deg); } 100% { opacity: 1; transform: none; } }
  @keyframes keyGlow { 0%,100% { box-shadow: 0 4px 10px rgba(120,90,40,0.3), 0 0 0 0 rgba(233,185,73,0.55); }
                       50%     { box-shadow: 0 4px 10px rgba(120,90,40,0.3), 0 0 0 12px rgba(233,185,73,0); } }
  @keyframes keyTurn { 0%,60%,100% { transform: rotate(0) translateX(0); } 70% { transform: rotate(0) translateX(3px); }
                       82% { transform: rotate(-90deg) translateX(3px); } 92% { transform: rotate(0) translateX(0); } }

  .status { min-height: 24px; font-size: 18px; font-weight: 700; text-align: center; }

  .bottom { margin-top: auto; display: flex; gap: 20px; }
  .round {
    width: 48px; height: 48px; border-radius: 50%; border: 1px solid #c9a46a; background: #fff; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  .status small { display: block; font-size: 14px; font-weight: 400; opacity: .75; margin-top: 2px; }

  .ghost {
    position: fixed; left: 0; top: 0; width: 28px; height: 36px; z-index: 50; pointer-events: none; display: none;
    filter: drop-shadow(0 6px 6px rgba(0,0,0,0.25));
  }

  @media (prefers-reduced-motion: reduce) {
    .keybtn.show, .keybtn svg { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="frame"><div class="ranks" id="ranks"></div><div class="board" id="board"></div><div class="files" id="files"></div></div>
  <div class="status" id="status"></div>
  <div class="tray">
    <div class="diamond" id="tray" role="button" aria-label="Queen: drag it under an envelope"></div>
    <button class="keybtn" id="keyBtn" type="button" aria-label="Hide the queen">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2a1a08" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="7" cy="12" r="4"/><circle cx="7" cy="12" r="1.2" fill="#2a1a08"/>
        <line x1="11" y1="12" x2="21" y2="12"/><line x1="17" y1="12" x2="17" y2="15.5"/><line x1="20" y1="12" x2="20" y2="16"/>
      </svg>
    </button>
  </div>
  <div class="bottom">
    <button class="round" id="restart" type="button" aria-label="Restart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8a611a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 12a8 8 0 1 0 2.4-5.7"/><polyline points="4,3 4,8 9,8"/>
      </svg>
    </button>
  </div>
</div>

<div class="ghost" id="ghost"></div>

<script>
(function () {
  var GEM = '<svg viewBox="0 0 20 26" width="100%" height="100%" aria-hidden="true">' +
    '<g fill="#f6f1e6" stroke="#3a2a14" stroke-width="0.9" stroke-linejoin="round">' +
    '<circle cx="4.5" cy="2.6" r="1.4"/><circle cx="10" cy="1.6" r="1.4"/><circle cx="15.5" cy="2.6" r="1.4"/>' +
    '<path d="M3 10 L4.5 4 L7.3 8.5 L10 3 L12.7 8.5 L15.5 4 L17 10 Z"/>' +
    '<path d="M4 10 Q10 12 16 10 L14 18 L6 18 Z"/>' +
    '<rect x="5" y="18" width="10" height="2.5" rx="0.8"/>' +
    '<path d="M3 24.5 L17 24.5 L15.8 20.5 L4.2 20.5 Z"/></g></svg>';

  var board = document.getElementById('board');
  var tray = document.getElementById('tray');
  var keyBtn = document.getElementById('keyBtn');
  var restartBtn = document.getElementById('restart');
  var statusEl = document.getElementById('status');
  var ghost = document.getElementById('ghost');
  tray.innerHTML = GEM; ghost.innerHTML = GEM;


  // ---- Envelopes: heart seal = bit 1, round seal = bit 0 ----
  var DESIGNS = {
    envelopes: { name: 'Envelopes', draw: function (on) {
      return '<svg viewBox="0 0 40 40"><g transform="translate(20,20)">' +
        '<rect x="-17" y="-12" width="34" height="24" rx="2" fill="#efe4c9"/><path d="M-17 -12 L0 3 L17 -12" stroke="#b9a582" stroke-width="1.5" fill="none"/>' +
        (on ? '<path d="M0 8 L-4.5 3 A2.5 2.5 0 0 1 0 0 A2.5 2.5 0 0 1 4.5 3 Z" fill="#c0392b"/>'
            : '<circle cx="0" cy="3" r="4" fill="#c0392b"/>') + '</g></svg>'; } }
  };
  var design = 'envelopes';

  // ---- State ----
  var gold = [];          // true = heart seal (bit 1), false = round seal (bit 0)
  var key = null;         // index 0..63 of the envelope hiding the queen
  var phase = 'setup';    // setup | locking | guess | reveal
  var opened = {};        // envelopes lifted during the guess
  var cells = [];

  // The board "points" to the XOR of the indices of all pieces in their "1" version.
  function pointer() {
    var x = 0;
    for (var i = 0; i < 64; i++) if (gold[i]) x ^= i;
    return x;
  }

  // ---- Labels like a chessboard: columns a–h, rows 1–8 (1 at the top) ----
  for (var n = 0; n < 8; n++) {
    var rk = document.createElement('div'); rk.textContent = n + 1; document.getElementById('ranks').appendChild(rk);
    var fl = document.createElement('div'); fl.textContent = 'abcdefgh'[n]; document.getElementById('files').appendChild(fl);
  }

  // ---- Build the board ----
  for (var i = 0; i < 64; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cell';
    b.dataset.i = i;
    b.setAttribute('aria-label', 'Row ' + (Math.floor(i / 8) + 1) + ', column ' + (i % 8 + 1));
    b.innerHTML = '<div class="piece"><div class="gem">' + GEM + '</div><div class="shell"></div></div>';
    board.appendChild(b);
    cells.push(b);
  }

  function fit() {
    var w = cells[0].getBoundingClientRect().width;
    board.style.setProperty('--k', (w / 42).toFixed(3));
  }
  window.addEventListener('resize', fit);

  // ---- Render ----
  function render() {
    for (var i = 0; i < 64; i++) {
      var c = cells[i], shell = c.firstChild.lastChild, k = design + (gold[i] ? 1 : 0);
      if (shell.dataset.k !== k) { shell.innerHTML = DESIGNS[design].draw(gold[i]); shell.dataset.k = k; }
      var isOpen = (phase === 'setup' && i === key) || !!opened[i];
      var hasGem = i === key && (phase === 'setup' || !!opened[i]);
      c.classList.toggle('open', isOpen);
      c.classList.toggle('has', hasGem);
      c.classList.toggle('empty', !!opened[i] && i !== key);
    }
    tray.classList.toggle('gone', !(phase === 'setup' && key === null));
    var wantKey = phase === 'setup' && key !== null;
    if (wantKey !== keyBtn.classList.contains('show')) keyBtn.classList.toggle('show', wantKey);
  }

  function setStatus(t, sub) {
    statusEl.textContent = t;
    if (sub) { var s = document.createElement('small'); s.textContent = sub; statusEl.appendChild(s); }
  }

  // ---- Game actions ----
  function newGame() {
    gold = [];
    for (var i = 0; i < 64; i++) gold.push(Math.random() < 0.5);
    key = null; phase = 'setup'; opened = {};
    setStatus('');
    render();
  }


  function lockIn() {
    if (phase !== 'setup' || key === null) return;
    phase = 'locking';
    render();                       // the piece drops over the queen...
    var t = pointer() ^ key;        // ...and, while all eyes are on it, one piece quietly switches version.
    setTimeout(function () { gold[t] = !gold[t]; render(); }, 150);
    setTimeout(function () { phase = 'guess'; render(); }, 450);
  }

  function guess(i) {
    if (phase !== 'guess' || opened[i]) return;
    opened[i] = true;
    if (i === key) {
      phase = 'reveal'; setStatus('Found it!'); render();
    } else {
      phase = 'reveal'; setStatus('Not here…'); render();
      setTimeout(function () { opened[key] = true; setStatus('It was here'); render(); }, 900);
    }
  }

  keyBtn.addEventListener('click', lockIn);
  restartBtn.addEventListener('click', newGame);

  // ---- Taps and drags ----
  var drag = null, suppressUntil = 0, hoverCell = null;

  function cellAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) {
      if (el.classList && el.classList.contains('cell')) return el;
      el = el.parentNode;
    }
    return null;
  }
  function moveGhost(x, y) {
    ghost.style.transform = 'translate(' + (x - 14) + 'px,' + (y - 44) + 'px)';
  }
  function setHover(c) {
    if (hoverCell === c) return;
    if (hoverCell) hoverCell.classList.remove('hover');
    hoverCell = c;
    if (hoverCell) hoverCell.classList.add('hover');
  }

  function startDrag(e, from) {
    if (phase !== 'setup') return;
    drag = { from: from, x0: e.clientX, y0: e.clientY, moved: false };
    e.preventDefault();
  }

  tray.addEventListener('pointerdown', function (e) { startDrag(e, 'tray'); });

  board.addEventListener('pointerdown', function (e) {
    var c = cellAt(e.clientX, e.clientY);
    if (c && phase === 'setup' && +c.dataset.i === key) startDrag(e, 'chest');
  });

  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 8) {
      drag.moved = true;
      if (drag.from === 'chest') { key = null; }
      tray.classList.add('gone');
      keyBtn.classList.remove('show');
      render();
      tray.classList.add('gone');
      ghost.style.display = 'block';
    }
    if (drag.moved) {
      moveGhost(e.clientX, e.clientY);
      setHover(cellAt(e.clientX, e.clientY));
    }
  });

  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    suppressUntil = Date.now() + 400;
    ghost.style.display = 'none';
    setHover(null);
    if (d.moved) {
      var c = e ? cellAt(e.clientX, e.clientY) : null;
      key = c ? +c.dataset.i : null;
    } else if (d.from === 'chest') {
      key = null;                     // a simple tap on the lifted cup takes the diamond back
    }
    render();
  }
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', function () { endDrag(null); });

  board.addEventListener('click', function (e) {
    if (Date.now() < suppressUntil) return;
    var c = cellAt(e.clientX, e.clientY);
    if (!c) return;
    var i = +c.dataset.i;
    if (phase === 'setup' && key === null) { key = i; render(); }
    else if (phase === 'guess') guess(i);
  });

  // ---- Start ----
  newGame();
  fit();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
  }
})();
</script>
</body>
</html>
